spring.application.name=txdemo
spring.datasource.url=${DB_URL:jdbc:postgresql://pg:5432/tx}
spring.datasource.username=tx
spring.datasource.password=${DB_PASSWORD:benchonly}
# A deliberately small pool with a short timeout, so exhaustion shows up as errors within seconds.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=2000
# eager (the default) or lazy; set per run with SPRING_DATASOURCE_CONNECTION_FETCH.
spring.datasource.connection-fetch=eager
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
downstream.url=${DOWNSTREAM_URL:http://wiremock:8080/slow}
management.endpoints.web.exposure.include=health,metrics
