<!doctype html>
<!-- Social preview card (1200x630) for the AOT cache post. make_cover.sh inlines charts.json
     into the DATA placeholder and screenshots this page; the warm-up chart is drawn by the site's own code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<link rel="stylesheet" href="../../assets/css/extended/charts.css">
<style>
  :root { --primary: rgb(30, 30, 30); --secondary: rgb(108, 108, 108); --border: rgb(230, 230, 228);
          --theme: rgb(255, 255, 255); --code-bg: rgb(245, 245, 245); --radius: 8px; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--theme);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 40px 56px 28px; display: flex; flex-direction: column; }
  h1 { margin: 0; font-size: 42px; line-height: 1.12; color: var(--primary); letter-spacing: -0.5px; }
  .key { margin: 12px 0 14px; font-size: 23px; color: var(--secondary); }
  .key b { color: var(--primary); }
  .chart { flex: 1; margin: 0; }
  .site { font-size: 18px; color: var(--secondary); text-align: right; }
</style>
</head>
<body>
<div class="card">
  <h1>JDK 25's AOT cache vs AppCDS: faster startup,<br>and a second off warm-up</h1>
  <p class="key">vs AppCDS on G1: <b id="start"></b> ms startup, <b id="warm"></b> ms over the first 2,000 requests</p>
  <figure class="cp-chart chart"><div class="cp-plot" data-chart="lines" data-key="warmup"></div></figure>
  <div class="site">platformnotes.dev</div>
</div>
<script src="../../assets/js/vendor/d3-7.9.0.min.js"></script>
<script src="../../assets/js/charts/common.js"></script>
<script src="../../assets/js/charts/lines.js"></script>
<script>
  const DATA = /*DATA*/null;
  document.getElementById("start").textContent = DATA.startup.rows[0].shift.label;
  document.getElementById("warm").textContent = DATA.warm_rows[0].shift.label;
  CPCharts.renderAll(DATA);
</script>
</body>
</html>
