spring.application.name=heavydemo
spring.datasource.url=${DB_URL:jdbc:postgresql://pg:5432/heavy}
spring.datasource.username=heavy
spring.datasource.password=${DB_PASSWORD:benchonly}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-on-migrate=true
management.endpoints.web.exposure.include=health,metrics,beans
