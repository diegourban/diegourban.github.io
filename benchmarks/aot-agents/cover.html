<!doctype html>
<!-- Social preview card (1200x630) for the OpenTelemetry agent post. make_cover.sh inlines charts.json
     into the DATA placeholder and screenshots this page; the startup chart is drawn by the site's own code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<link rel="stylesheet" href="../../assets/css/extended/charts.css">
<style>
  :root { --primary: rgb(30, 30, 30); --secondary: rgb(108, 108, 108); --border: rgb(230, 230, 228);
          --theme: rgb(255, 255, 255); --code-bg: rgb(245, 245, 245); --radius: 8px; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--theme);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 40px 56px 28px; display: flex; flex-direction: column; }
  h1 { margin: 0; font-size: 42px; line-height: 1.12; color: var(--primary); letter-spacing: -0.5px; }
  .key { margin: 12px 0 14px; font-size: 23px; color: var(--secondary); }
  .key b { color: var(--primary); }
  .chart { flex: 1; margin: 0; }
  .site { font-size: 18px; color: var(--secondary); text-align: right; }
</style>
</head>
<body>
<div class="card">
  <h1>The OpenTelemetry agent and<br>JDK 25's AOT cache don't mix</h1>
  <p class="key">Agent: <b>+1.6 s</b> startup · AOT cache trained with it: <b>0 of 15</b> runs · AppCDS: <b>0.15 s</b> back</p>
  <figure class="cp-chart chart"><div class="cp-plot" data-chart="paired-shift" data-key="startup"></div></figure>
  <div class="site">platformnotes.dev</div>
</div>
<script src="../../assets/js/vendor/d3-7.9.0.min.js"></script>
<script src="../../assets/js/charts/common.js"></script>
<script src="../../assets/js/charts/paired-shift.js"></script>
<script>
  const DATA = /*DATA*/null;
  // Four of the post's seven rows, so the chart fits the card: the two archives without the agent, the agent
  // alone, and the agent with the AppCDS archive the post recommends.
  const KEEP = ["AOT cache, no agent", "AppCDS, no agent", "Agent, default CDS", "Agent, AppCDS trained without it"];
  DATA.startup.rows = DATA.startup.rows.filter((r) => KEEP.includes(r.setup));
  CPCharts.renderAll(DATA);
</script>
</body>
</html>
