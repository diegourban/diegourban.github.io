# baseURL is overridden in CI by the GitHub Pages workflow (--baseURL).
baseURL = "https://example.com/"
locale = "en-US"
title = "Platform Notes"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = true
pagination.pagerSize = 10

[params]
  env = "production"
  description = "Platform engineering, in practice: JVM, Spring Boot, PostgreSQL, CI/CD, caching and authorization."
  author = "Diego Leonardo Urban"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  # Every post links to its source data in this repo. Set to your GitHub repo.
  editPost.URL = "https://github.com/diegourban/diegourban.github.io/tree/master/content"
  editPost.Text = "Source"
  editPost.appendFilePath = true
  # Social preview image for pages without their own cover (scripts/make_site_card.sh renders it).
  images = ["site-card.png"]

  [params.homeInfoParams]
    Title = "Hi, I'm Diego"
    Content = "Platform engineer. These are my notes on what I build and measure: the JVM, Spring Boot, PostgreSQL, CI/CD, caching and authorization. Every benchmark here ships with its scripts and raw data."

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/diegoleonardourban"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/diegourban"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  # Structured data (layouts/_partials/templates/schema_json.html): the Person behind the site.
  [params.schema]
    alternateName = "Diego Urban"
    jobTitle = "Software Engineer"
    sameAs = ["https://www.linkedin.com/in/diegoleonardourban", "https://github.com/diegourban"]

  # Cookieless page views (layouts/_partials/extend_footer.html); counted in production builds only.
  [params.goatcounter]
    code = "diegourban"

# Tags only: no categories (an empty /categories/ page is thin content for search engines).
[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON feeds the search page

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "archives"
  name = "Archive"
  url = "/archives/"
  weight = 20
[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 30
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
  style = "monokai"
