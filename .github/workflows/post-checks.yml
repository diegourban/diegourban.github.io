# Pre-publish checks on every pull request that changes a post (drafts included), summarised in one PR comment.
# Fails on: a missing or incomplete references list, or 8+ words copied from a cited source (scripts/check_posts.py).
# Warns on: broken links (lychee) and the post's wording found elsewhere on the web (scripts/check_web_copies.py,
# runs only when the TAVILY_API_KEY repository secret exists). Not a required check, so it never blocks a merge.
name: Post checks

on:
  pull_request:
    paths:
      - "content/posts/**"
      - "scripts/check_posts.py"
      - "scripts/check_web_copies.py"
      - ".github/workflows/post-checks.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: post-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed posts
        id: posts
        run: |
          # Posts this PR touches; all posts when only the checks themselves changed.
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'content/posts/*/index.md' | while read -r f; do [ -f "$f" ] && echo "$f"; done | tr '\n' ' ')
          [ -z "$files" ] && files=$(ls content/posts/*/index.md | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Checking: $files"

      - name: References and overlap with cited sources
        id: refs
        continue-on-error: true
        run: python3 scripts/check_posts.py --report refs.md ${{ steps.posts.outputs.files }}

      - name: Web search for copies
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python3 scripts/check_web_copies.py --report web.md ${{ steps.posts.outputs.files }}

      - name: Link check
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # --root-dir resolves /posts/... links; DOIs are permanent and journal sites answer bots with 403.
          args: --no-progress --max-retries 2 --timeout 30 --root-dir ${{ github.workspace }}/content --exclude '^https://doi\.org/' ${{ steps.posts.outputs.files }}
          output: links.md
          fail: false
          jobSummary: false

      - name: Write the summary
        if: always()
        run: |
          {
            echo "<!-- post-checks -->"
            echo "# Post checks"
            echo
            echo "References and overlap: **${{ steps.refs.outcome == 'success' && 'passed' || 'failed' }}** · links and web search only warn."
            echo
            cat refs.md 2>/dev/null || echo "References check didn't run."
            echo
            cat web.md 2>/dev/null
            echo
            echo "## Links (warning only)"
            cat links.md 2>/dev/null || echo "Link check didn't run."
            echo
            echo "_Optional second opinion: paste the post into [Quetext](https://www.quetext.com/) in two parts of up to 1,000 words._"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One comment per PR, updated on every push.
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- post-checks -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@summary.md >/dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@summary.md >/dev/null
          fi

      - name: Fail on references or overlap problems
        if: steps.refs.outcome == 'failure'
        run: |
          echo "::error::The references or overlap check failed. See the PR comment."
          exit 1
