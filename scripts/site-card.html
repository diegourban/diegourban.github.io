<!doctype html>
<!-- Default social preview card (1200x630) for pages without their own cover.
     make_site_card.sh screenshots it into static/site-card.png. No domain on purpose: it survives a domain move. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site card</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ffffff;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 0 96px;
          display: flex; flex-direction: column; justify-content: center; }
  .accent { width: 72px; height: 8px; border-radius: 4px; background: #2a78d6; margin-bottom: 36px; }
  h1 { margin: 0; font-size: 88px; line-height: 1; color: rgb(30, 30, 30); letter-spacing: -1.5px; }
  p { margin: 28px 0 0; font-size: 36px; line-height: 1.3; color: rgb(108, 108, 108); max-width: 900px; }
  p.by { margin-top: 14px; font-size: 26px; }
  .dots { position: absolute; right: 96px; bottom: 80px; display: flex; gap: 14px; align-items: flex-end; }
  .dots span { width: 14px; border-radius: 7px; background: #2a78d6; opacity: .85; }
</style>
</head>
<body>
<div class="card">
  <div class="accent"></div>
  <h1>Platform Notes</h1>
  <p>Platform engineering, in practice.</p>
  <p class="by">by Diego Urban</p>
</div>
<div class="dots" aria-hidden="true">
  <span style="height:14px"></span><span style="height:38px"></span><span style="height:24px"></span>
  <span style="height:62px"></span><span style="height:44px"></span><span style="height:90px"></span>
</div>
</body>
</html>
